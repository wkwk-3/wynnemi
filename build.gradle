plugins {
    id "fabric-loom" version "${loom_version}"
    id "java"
}

version = "${mod_version}+${minecraft_version}"
group = maven_group

base {
    archivesName = mod_id
}

repositories {
    mavenCentral()
    // PF-EMI（コンパイル専用）。Modrinth の配布物をそのまま使う
    exclusiveContent {
        forRepository { maven { url "https://api.modrinth.com/maven" } }
        filter { includeGroup "maven.modrinth" }
    }
    // Mod Menu（設定画面の入り口。入っていなくても WEI は動く）
    maven { url "https://maven.terraformersmc.com/releases" }
}

// Wynntils は Maven で配布されていないため libs/ に置いた jar を参照する。
def libJar = { String prefix ->
    def found = fileTree("libs") { include "${prefix}*.jar" }.files
    if (found.isEmpty()) {
        throw new GradleException("libs/ に ${prefix}*.jar が見つかりません。README.md のビルド手順を確認してください。")
    }
    return files(found)
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // Wynntils と同じ Mojang 公式マッピング
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // 実行時は mods フォルダの本体を使うので compileOnly。
    // runClient で試したい場合は modLocalRuntime に変える。
    modCompileOnly libJar("wynntils")
    // EMI は PF-EMI を前提にする（同梱しない）。ユーザーが入れるのと同じ Modrinth の版でコンパイルする
    modCompileOnly "maven.modrinth:pf-emi:${pf_emi_version}"
    modCompileOnly "com.terraformersmc:modmenu:17.0.1"
}

processResources {
    def props = [version: version, minecraft_version: minecraft_version, fabric_loader_version: fabric_loader_version]
    inputs.properties props
    filesMatching("fabric.mod.json") {
        expand props
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

// 単体テスト（Minecraft・Wynntils を起動せずに確かめられる純粋なロジックだけ）
dependencies {
    testImplementation platform("org.junit:junit-bom:5.11.3")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
    testLogging {
        events "failed"
        exceptionFormat "full"
    }
}
