name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WYNNTILS_TAG: v4.2.17
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Wynntils は Maven に無いので、ビルド時に libs/ へ取ってくる
      - name: Download Wynntils (Fabric)
        run: |
          mkdir -p libs
          gh release download "$WYNNTILS_TAG" -R Wynntils/Wynntils -p '*abric*.jar' -D dl-wynntils
          ls dl-wynntils
          cp "$(ls dl-wynntils/*.jar | grep -vi sources | head -1)" libs/wynntils.jar

      # emi/（EMI のフォーク）を先にビルドして、MOD 本体のコンパイルと同梱に使う
      - name: Build EMI fork
        working-directory: emi
        run: |
          # 上流の gradlew は CRLF なので LF にしてから実行する
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew :fabric:remapJar --stacktrace
          ls fabric/build/libs
          cp "$(ls fabric/build/libs/*.jar | grep -v -e '-api' -e '-sources' -e '-dev' | head -1)" ../libs/wei-emi-bundled.jar

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: wei
          path: build/libs/*.jar

      # テスト用: main への push のたびに、jar をそのまま Releases の「dev」に置き直す（zip に包まれない）
      - name: Publish dev pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          jar=$(ls build/libs/*.jar | grep -v -e '-sources' | head -1)
          echo "jar: $jar"
          gh release delete dev -y --cleanup-tag 2>/dev/null || true
          gh release create dev "$jar" --prerelease --target "$GITHUB_SHA" \
            --title "dev (${GITHUB_SHA::7})" \
            --notes "main の最新コミット ${GITHUB_SHA::7} のテスト用ビルド。push のたびに置き換わります。"
