name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WYNNTILS_TAG: v4.2.17
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Wynntils は Maven に無いので、ビルド時に libs/ へ取ってくる
      - name: Download Wynntils (Fabric)
        run: |
          mkdir -p libs
          gh release download "$WYNNTILS_TAG" -R Wynntils/Wynntils -p '*abric*.jar' -D dl-wynntils
          ls dl-wynntils
          cp "$(ls dl-wynntils/*.jar | grep -vi sources | head -1)" libs/wynntils.jar

      # emi/（EMI のフォーク）を先にビルドして、MOD 本体のコンパイルと同梱に使う
      - name: Build EMI fork
        working-directory: emi
        run: |
          chmod +x gradlew
          ./gradlew :fabric:remapJar --stacktrace
          ls fabric/build/libs
          cp "$(ls fabric/build/libs/*.jar | grep -v -e '-api' -e '-sources' -e '-dev' | head -1)" ../libs/emi.jar

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: wynnemi
          path: build/libs/*.jar
