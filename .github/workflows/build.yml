name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WYNNTILS_TAG: v4.2.18
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Wynntils は Maven に無いので、ビルド時に libs/ へ取ってくる
      - name: Download Wynntils (Fabric)
        run: |
          mkdir -p libs
          gh release download "$WYNNTILS_TAG" -R Wynntils/Wynntils -p '*abric*.jar' -D dl-wynntils
          ls dl-wynntils
          cp "$(ls dl-wynntils/*.jar | grep -vi sources | head -1)" libs/wynntils.jar
          # fabric.mod.json の依存範囲と照らすため、MOD としてのバージョンを出す
          unzip -p libs/wynntils.jar fabric.mod.json | grep -m1 '"version"'

      # emi/（PF-EMI のソース、無改造）をビルドして、MOD 本体のコンパイルだけに使う（同梱しない）
      - name: Build EMI fork
        working-directory: emi
        run: |
          # 上流の gradlew は CRLF なので LF にしてから実行する
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew :fabric:remapJar --stacktrace
          ls fabric/build/libs
          cp "$(ls fabric/build/libs/*.jar | grep -v -e '-api' -e '-sources' -e '-dev' | head -1)" ../libs/pf-emi-compile.jar
          unzip -p ../libs/pf-emi-compile.jar fabric.mod.json | grep -m1 '"version"'

      # 一時的: Modrinth の PF-EMI の中身（バージョンと Mixin の当たり先）を確かめる
      - name: Inspect Modrinth PF-EMI
        run: |
          url=$(curl -s 'https://api.modrinth.com/v2/project/pf-emi/version?loaders=%5B%22fabric%22%5D&game_versions=%5B%221.21.11%22%5D' | jq -r '.[0].files[] | select(.primary) | .url')
          curl -sL "$url" -o pf-emi-modrinth.jar
          sha512sum pf-emi-modrinth.jar
          unzip -p pf-emi-modrinth.jar fabric.mod.json | grep -m1 '"version"'
          mkdir -p pfx && cd pfx && unzip -q ../pf-emi-modrinth.jar 'dev/emi/emi/*'
          for c in search/EmiSearch\$SearchWorker search/EmiSearch\$CompiledQuery runtime/EmiReloadManager runtime/EmiReloadManager\$ReloadWorker runtime/EmiFavorites runtime/EmiSidebars runtime/EmiReloadLog runtime/EmiPersistentData api/EmiApi screen/EmiScreenManager platform/EmiAgnos; do
            echo "== $c"; javap -p "dev/emi/emi/$c.class" | grep -E 'query|run\(|lookup|load|save|getPlugins|bake|displayRecipes|displayUses|setPages|renderSlotOverlays|compiledQuery|search;|loadedResourcesMask|reloadTags|reloadRecipes|clear|restart|isEmpty|test\(|FILE|getHandledScreen|highlight' || echo MISSING
          done
          javap -p dev/emi/emi/screen/widget/EmiSearchWidget.class | grep highlight || true

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: wei
          path: build/libs/*.jar

      # テスト用: main への push のたびに、jar をそのまま Releases の「dev」に置き直す（zip に包まれない）
      - name: Publish dev pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          jar=$(ls build/libs/*.jar | grep -v -e '-sources' | head -1)
          echo "jar: $jar"
          gh release delete dev -y --cleanup-tag 2>/dev/null || true
          gh release create dev "$jar" --prerelease --target "$GITHUB_SHA" \
            --title "dev (${GITHUB_SHA::7})" \
            --notes "main の最新コミット ${GITHUB_SHA::7} のテスト用ビルド。push のたびに置き換わります。"

      # 正式リリース: gradle.properties の mod_version が「-」を含まない版で、まだその v タグが無ければ Releases に出す
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          case "$version" in *-*) echo "pre-release version $version, skip"; exit 0;; esac
          if gh release view "v$version" >/dev/null 2>&1; then echo "v$version already released"; exit 0; fi
          jar=$(ls build/libs/*.jar | grep -v -e '-sources' | head -1)
          gh release create "v$version" "$jar" --target "$GITHUB_SHA" --title "WEI v$version" --notes-file docs/RELEASE_NOTES.md
