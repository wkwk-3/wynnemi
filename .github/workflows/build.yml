name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WYNNTILS_TAG: v4.2.18
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Wynntils は Maven に無いので、ビルド時に libs/ へ取ってくる
      - name: Download Wynntils (Fabric)
        run: |
          mkdir -p libs
          gh release download "$WYNNTILS_TAG" -R Wynntils/Wynntils -p '*abric*.jar' -D dl-wynntils
          ls dl-wynntils
          cp "$(ls dl-wynntils/*.jar | grep -vi sources | head -1)" libs/wynntils.jar
          # fabric.mod.json の依存範囲と照らすため、MOD としてのバージョンを出す
          unzip -p libs/wynntils.jar fabric.mod.json | grep -m1 '"version"'

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: wei
          path: build/libs/*.jar

      # テスト用: main への push のたびに、jar をそのまま Releases の「dev」に置き直す（zip に包まれない）
      - name: Publish dev pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          jar=$(ls build/libs/*.jar | grep -v -e '-sources' | head -1)
          echo "jar: $jar"
          gh release delete dev -y --cleanup-tag 2>/dev/null || true
          gh release create dev "$jar" --prerelease --target "$GITHUB_SHA" \
            --title "dev (${GITHUB_SHA::7})" \
            --notes "main の最新コミット ${GITHUB_SHA::7} のテスト用ビルド。push のたびに置き換わります。"

      # 正式リリース: gradle.properties の mod_version が「-」を含まない版で、まだその v タグが無ければ Releases に出す
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          case "$version" in *-*) echo "pre-release version $version, skip"; exit 0;; esac
          if gh release view "v$version" >/dev/null 2>&1; then echo "v$version already released"; exit 0; fi
          jar=$(ls build/libs/*.jar | grep -v -e '-sources' | head -1)
          gh release create "v$version" "$jar" --target "$GITHUB_SHA" --title "WEI v$version" --notes-file docs/RELEASE_NOTES.md
