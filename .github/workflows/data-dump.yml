name: Data dump
on:
  push:
    branches: [data-dump]
    paths: [.github/workflows/data-dump.yml]
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p data-dump
          curl -sS -o data-dump/wv_ranking.json -w "ranking %{http_code} %{size_download}\n" 'https://www.wynnventory.com/api/trademarket/ranking'
          curl -sS -o data-dump/wv_price_nokey.json -w "price %{http_code}\n" 'https://www.wynnventory.com/api/v2/market/items/Warp/price'
          ls -la data-dump
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add data-dump && git commit -m "Data dump" && git push
